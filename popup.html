<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Blur Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 WhatsApp Blur</h1>
            <p>Blur messages from specific contacts</p>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="users">Manage Users</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </div>
        
        <!-- Settings Tab -->
        <div id="settings-tab" class="tab-content">
            <div class="form-group">
                <label for="contactName">Contact Name to Blur:</label>
                <input type="text" id="contactName" placeholder="Enter contact name (e.g., John Doe)" />
            </div>
            
            <div class="settings-section">
                <h3>Blur Type</h3>
                
                <div class="blur-type-selection">
                    <div class="blur-type-option">
                        <label class="radio-label">
                            <input type="radio" name="blurType" value="standard" checked>
                            <span class="radio-mark"></span>
                            <div class="blur-type-info">
                                <strong>Standard Blur</strong>
                                <small>Classic blur effect with red overlay</small>
                            </div>
                        </label>
                    </div>
                    
                    <div class="blur-type-option">
                        <label class="radio-label">
                            <input type="radio" name="blurType" value="pixelated">
                            <span class="radio-mark"></span>
                            <div class="blur-type-info">
                                <strong>Pixelated</strong>
                                <small>Pixelated mosaic effect</small>
                            </div>
                        </label>
                    </div>
                    
                    <div class="blur-type-option">
                        <label class="radio-label">
                            <input type="radio" name="blurType" value="blackout">
                            <span class="radio-mark"></span>
                            <div class="blur-type-info">
                                <strong>Blackout</strong>
                                <small>Complete black overlay</small>
                            </div>
                        </label>
                    </div>
                    
                    <div class="blur-type-option">
                        <label class="radio-label">
                            <input type="radio" name="blurType" value="invisible">
                            <span class="radio-mark"></span>
                            <div class="blur-type-info">
                                <strong>Invisible</strong>
                                <small>Make content completely invisible</small>
                            </div>
                        </label>
                    </div>
                    
                    <div class="blur-type-option">
                        <label class="radio-label">
                            <input type="radio" name="blurType" value="custom">
                            <span class="radio-mark"></span>
                            <div class="blur-type-info">
                                <strong>Custom</strong>
                                <small>Custom blur with adjustable intensity</small>
                            </div>
                        </label>
                    </div>
                </div>
                
                <div class="custom-blur-settings" id="customBlurSettings" style="display: none;">
                    <div class="setting-item">
                        <label for="blurIntensity">Blur Intensity:</label>
                        <input type="range" id="blurIntensity" min="5" max="50" value="25" step="5">
                        <span id="blurIntensityValue">25px</span>
                    </div>
                    
                    <div class="setting-item">
                        <label for="overlayColor">Overlay Color:</label>
                        <input type="color" id="overlayColor" value="#ff0000">
                    </div>
                    
                    <div class="setting-item">
                        <label for="overlayOpacity">Overlay Opacity:</label>
                        <input type="range" id="overlayOpacity" min="0.1" max="1" value="0.8" step="0.1">
                        <span id="overlayOpacityValue">80%</span>
                    </div>
                </div>
            </div>
            
            <div class="settings-section">
                <h3>Blur Settings</h3>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chatListName" checked>
                        <span class="checkmark"></span>
                        Chat List Name
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chatListMessage" checked>
                        <span class="checkmark"></span>
                        Chat List Message Preview
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chatListAvatar" checked>
                        <span class="checkmark"></span>
                        Chat List Avatar
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="headerName" checked>
                        <span class="checkmark"></span>
                        Header Name
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="headerAvatar" checked>
                        <span class="checkmark"></span>
                        Header Avatar
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="messageText" checked>
                        <span class="checkmark"></span>
                        Message Text
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="messageImages" checked>
                        <span class="checkmark"></span>
                        Message Images
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button id="applyBtn" class="btn btn-primary">Apply Blur</button>
                <button id="toggleBtn" class="btn btn-secondary">Toggle Blur</button>
                <button id="clearBtn" class="btn btn-danger">Clear All</button>
            </div>
        </div>
        
        <!-- Users Management Tab -->
        <div id="users-tab" class="tab-content active">
            <div class="users-header">
                <h3>👥 Manage Users</h3>
                <p>Detect and manage blur settings for all visible users</p>
            </div>
            
            <div class="users-controls">
                <button id="scanUsersBtn" class="btn btn-primary">🔍 Scan for Users</button>
                <button id="blurAllUsersBtn" class="btn btn-secondary">🔒 Blur All Users</button>
                <button id="unblurAllUsersBtn" class="btn btn-secondary">👁️ Unblur All Users</button>
                <button id="clearAllUsersBtn" class="btn btn-danger">🗑️ Clear All Users</button>
            </div>
            
            <div id="usersList" class="users-list">
                <div class="no-users-message">
                    <p>Click "Scan for Users" to detect all users currently visible on WhatsApp Web</p>
                </div>
            </div>
        </div>
        
        <div class="status">
            <div id="statusMessage" class="status-message"></div>
        </div>
        
        <div class="footer">
            <p>Make sure you're on WhatsApp Web for this to work</p>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
