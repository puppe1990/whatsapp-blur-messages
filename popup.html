<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Blur Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 WhatsApp Blur</h1>
            <p>Blur messages from specific contacts</p>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="users">Manage Users</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </div>
        
        <!-- Settings Tab -->
        <div id="settings-tab" class="tab-content">
            <div class="form-group">
                <label for="contactName">Contact Name to Blur:</label>
                <input type="text" id="contactName" placeholder="Enter contact name (e.g., John Doe)" />
            </div>
            
            <div class="settings-section">
                <h3>Blur Settings</h3>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chatListName" checked>
                        <span class="checkmark"></span>
                        Chat List Name
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chatListMessage" checked>
                        <span class="checkmark"></span>
                        Chat List Message Preview
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chatListAvatar" checked>
                        <span class="checkmark"></span>
                        Chat List Avatar
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="headerName" checked>
                        <span class="checkmark"></span>
                        Header Name
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="headerAvatar" checked>
                        <span class="checkmark"></span>
                        Header Avatar
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="messageText" checked>
                        <span class="checkmark"></span>
                        Message Text
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="messageImages" checked>
                        <span class="checkmark"></span>
                        Message Images
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button id="applyBtn" class="btn btn-primary">Apply Blur</button>
                <button id="toggleBtn" class="btn btn-secondary">Toggle Blur</button>
                <button id="clearBtn" class="btn btn-danger">Clear All</button>
            </div>
        </div>
        
        <!-- Users Management Tab -->
        <div id="users-tab" class="tab-content active">
            <div class="users-header">
                <h3>👥 Manage Users</h3>
                <p>Detect and manage blur settings for all visible users</p>
            </div>
            
            <div class="users-controls">
                <button id="scanUsersBtn" class="btn btn-primary">🔍 Scan for Users</button>
                <button id="blurAllUsersBtn" class="btn btn-secondary">🔒 Blur All Users</button>
                <button id="unblurAllUsersBtn" class="btn btn-secondary">👁️ Unblur All Users</button>
                <button id="clearAllUsersBtn" class="btn btn-danger">🗑️ Clear All Users</button>
            </div>
            
            <div id="usersList" class="users-list">
                <div class="no-users-message">
                    <p>Click "Scan for Users" to detect all users currently visible on WhatsApp Web</p>
                </div>
            </div>
        </div>
        
        <div class="status">
            <div id="statusMessage" class="status-message"></div>
        </div>
        
        <div class="footer">
            <p>Make sure you're on WhatsApp Web for this to work</p>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
